name: Generate Berlin test pages

# Manual testing only. Production deployment should later attach the generator
# to the existing Airtable -> places-berlin.json update workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate noindex test HTML pages from JSON
        run: python3 generate_test_pages.py

      - name: Commit only generated test pages
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'test-page-*.html'
          if git diff --cached --quiet; then
            echo 'No generated pages changed.'
          else
            git commit -m 'Generate test Berlin pagination pages'
            git push
          fi
