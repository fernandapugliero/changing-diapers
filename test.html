  <style>
    /* Base: same as the index */
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 2rem;
      background: #fff;
      color: #333;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    nav {
      margin-bottom: 2rem;
      padding-top: 1rem;
      display: flex;
      align-items: center;
    }

    nav img {
      width: 30px;
      height: auto;
      margin-right: 30px;
    }

    nav a {
      margin-right: 20px;
      text-decoration: none;
      font-weight: 600;
      color: inherit;
    }

    /* Hero: same typography and spacing as index h1 and h2 */
    .submit-hero h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem 0;
      text-align: center;
      line-height: 1.2;
    }

    .submit-hero .hero-subtitle {
      font-size: 1.1rem;
      font-weight: 400;
      color: #666;
      margin: 0 auto 2rem auto;
      text-align: center;
      line-height: 1.4;
      max-width: 760px;
    }

    .submit-hero .hero-subtitle a {
      color: #0070f3;
      text-decoration: none;
    }

    .submit-hero .hero-subtitle a:hover {
      text-decoration: underline;
    }

    iframe.airtable-embed {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: 3600px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: transparent;
    }

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.9rem;
      color: #777;
    }

    footer a {
      color: #0070f3;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        padding: 2rem;
      }

      iframe.airtable-embed {
        height: 3600px;
      }
    }

    @media (max-width: 480px) {
      iframe.airtable-embed {
        height: 3200px;
      }
    }
  </style>
