<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Submit a Location | Fix My Diaper</title>
  <meta name="description" content="Submit your favorite baby-friendly places with changing tables and help other parents find the best diaper-changing locations in Berlin and beyond." />
  <meta name="keywords" content="submit diaper changing location, diaper changing, baby-friendly places, family-friendly cafes, diaper changing stations" />
  <meta name="robots" content="index, follow" />

  <meta property="og:title" content="Submit a Location | Fix My Diaper" />
  <meta property="og:description" content="Submit your favorite baby-friendly places with changing tables and help other parents find the best diaper-changing locations in Berlin and beyond." />
  <meta property="og:image" content="https://fixmydiaper.com/images/logo.png" />
  <meta property="og:url" content="https://fixmydiaper.com/submit" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Submit a Location | Fix My Diaper" />
  <meta name="twitter:description" content="Submit your favorite baby-friendly places with changing tables and help other parents find the best diaper-changing locations in Berlin and beyond." />
  <meta name="twitter:image" content="https://fixmydiaper.com/images/logo.png" />

  <!-- Airtable connection -->
  <link rel="preconnect" href="https://airtable.com" crossorigin />
  <link rel="dns-prefetch" href="//airtable.com" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JGYVLDZQTM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JGYVLDZQTM');
  </script>

  <link rel="icon" href="/images/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 2rem;
      background: #fff;
      color: #333;
      overflow-x: hidden;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
    }

    nav {
      margin-bottom: 2rem;
      padding-top: 1rem;
      display: flex;
      align-items: center;
    }

    nav img {
      width: 30px;
      height: auto;
      margin-right: 30px;
    }

    nav a {
      margin-right: 20px;
      text-decoration: none;
      font-weight: 600;
      color: inherit;
    }

    /* HERO */

    .submit-hero h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem;
      text-align: center;
      line-height: 1.2;
    }

    .submit-hero .hero-subtitle {
      font-size: 1.1rem;
      font-weight: 400;
      color: #666;
      margin: 0 auto 2rem;
      text-align: center;
      line-height: 1.4;
      max-width: 760px;
    }

    .submit-hero .hero-subtitle a,
    .upload-help a,
    footer a {
      color: #0070f3;
      text-decoration: none;
    }

    .submit-hero .hero-subtitle a:hover,
    .upload-help a:hover,
    footer a:hover {
      text-decoration: underline;
    }

    /* AIRTABLE RESPONSIVE FRAME */

    /*
      No fixed container height.
      Airtable's script controls the iframe height.
      Header crop stays independent for desktop/mobile.
    */

    .airtable-frame {
      --airtable-header-crop: 165px;
      overflow: hidden;
      border: 0;
    }

    iframe.airtable-embed {
      display: block;
      width: 100%;
      max-width: 100%;
      margin-top: calc(-1 * var(--airtable-header-crop));
      border: 0 !important;
      border-radius: 0;
      box-shadow: none !important;
      outline: 0;
      background: transparent;
    }

    /* PHOTO UPLOAD HELP */

    .upload-help {
      margin: 0.75rem 0 0;
      text-align: center;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #666;
    }

    /* FOOTER */

    footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.9rem;
      color: #777;
    }

    /* TABLET / MOBILE */

    @media (max-width: 768px) {

      body {
        padding: 1.25rem 1rem 2rem;
      }

      .airtable-frame {
        --airtable-header-crop: 130px;
      }

      nav {
        gap: 1rem;
        flex-wrap: wrap;
      }

      nav img {
        margin-right: 0.5rem;
      }

      nav a {
        margin-right: 0;
      }

    }

    /* SMALL MOBILE */

    @media (max-width: 480px) {

      .submit-hero h1 {
        font-size: 1.8rem;
      }

      .submit-hero .hero-subtitle {
        font-size: 1rem;
      }

    }
  </style>
</head>

<body>
  <div class="page">

    <nav aria-label="Main navigation">
      <img src="images/logo.png" alt="Fix My Diaper Logo" />

      <a href="https://fixmydiaper.com/">Map</a>
      <a href="list">List</a>
      <a href="submit" aria-current="page">Submit</a>
    </nav>

    <main>

      <header class="submit-hero">

        <h1>Submit a location</h1>

        <p class="hero-subtitle">
          Know a great spot with a changing table?
          Add it now using the form below.
        </p>

      </header>

      <!-- Airtable dynamic height script -->
      <script src="https://static.airtable.com/js/embed/embed_snippet_v1.js"></script>

      <div class="airtable-frame">

        <iframe
          id="airtable-form"
          class="airtable-embed airtable-dynamic-height"
          title="Submit a location to Fix My Diaper"
          src="https://airtable.com/embed/appSQEoBDSbHzPIS2/shrdTkqA8gM7VLkoR"
          width="100%"
          height="3200"
          loading="eager">
        </iframe>

      </div>

      <!-- Alternative for photo uploads -->
      <p class="upload-help">
        Having trouble uploading a photo?
        <a
          href="https://airtable.com/appSQEoBDSbHzPIS2/shrdTkqA8gM7VLkoR"
          target="_blank"
          rel="noopener noreferrer">
          Open the form directly in a new tab
        </a>.
      </p>

    </main>

    <footer>

      <a href="about">About</a> |
      <a href="newsletter">Newsletter</a> |
      <a href="partnerships">Partnerships</a> |
      <a href="https://www.instagram.com/fixmydiaper"
         target="_blank"
         rel="noopener noreferrer">Instagram</a>

      <br><br>

      Made with ♥️ in Berlin<br />

      Created by
      <a href="https://fernandapugliero.com"
         target="_blank"
         rel="noopener noreferrer">Fernanda Pugliero</a>
      &amp; son

    </footer>

  </div>

  <script>
    /*
      Mobile fallback height.
      Airtable's dynamic resizing script should
      override this value when supported.
    */

    if (window.matchMedia('(max-width: 768px)').matches) {
      document.getElementById('airtable-form')
        .setAttribute('height', '4600');
    }
  </script>

</body>
</html>
